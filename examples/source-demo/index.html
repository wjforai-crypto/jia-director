<!doctype html><html lang="zh"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Source-film portable smoke</title>
<style>html,body{margin:0;background:#f6f1e6}canvas{display:block}</style><canvas width="640" height="360"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
window.stateAt=t=>({objects:[{id:'ball',space:'screen',x:80+480*Math.min(1,Math.max(0,t/3)),y:180-55*Math.sin(t*Math.PI*2/3)}]});
window.renderAt=t=>{const p=stateAt(t).objects[0];ctx.fillStyle='#f6f1e6';ctx.fillRect(0,0,640,360);ctx.strokeStyle='#1f4251';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(60,250);ctx.lineTo(580,250);ctx.stroke();ctx.fillStyle='#d26339';ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1f4251';ctx.fillRect(60,290,520*Math.min(1,t/3),6);};
renderAt(0);window.ready=true;
</script></html>
