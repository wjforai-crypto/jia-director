name: Render dependency security

on:
  push:
    paths:
      - 'skills/jia-director/**'
      - '.github/workflows/render-dependencies.yml'
  pull_request:
    paths:
      - 'skills/jia-director/**'
      - '.github/workflows/render-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check all shipped template locks
        run: node skills/jia-director/scripts/check-render-dependencies.mjs
      - name: Audit active template
        working-directory: skills/jia-director/assets/livecanvas-remotion
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit historical template
        working-directory: skills/jia-director/assets/review/jia-video原文快照/assets/livecanvas-remotion
        run: npm audit --package-lock-only --audit-level=high
